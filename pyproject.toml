[project]
name = "neverwake"
version = "0.1.0"
description = "Diffusion world model"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "cd-fvd>=0.1.1",
    "craftax>=1.7.0",
    "dacite>=1.9.2",
    "gym-super-mario-bros>=9.1.0",
    "gymnasium[atari]>=1.2.3",
    "matplotlib>=3.11.1",
    "numpy>=2.4.2",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scipy<1.18",
    "stable-baselines3>=2.9.0",
    "torch>=2.13.0",
    "torch-fidelity>=0.4.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "vizdoom>=1.3.2",
    "wandb>=0.30.0",
]

[dependency-groups]
dev = [
    "basedpyright",
    "ruff",
    "ipykernel>=7.1.0",
    "ipython>=9.9.0",
    "modal>=1.6.0",
] 

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard" 
include = ["src"]
