# Tiny run that exercises every part of the pipeline in about a minute
seed: 0

env:
  type: atari
  game: Breakout
  rescaled_shape: [3, 64, 64]
  episodic_life: true
  max_noop: 30
  frameskip: 4

denoiser:
  inp_proj_ch: 32
  midcoder_ch: 32
  enc_dec_channels: [32, 32]
  group_size: 32
  cond_dim: 64
  num_heads: 4
  fourier_w_min: 0.2
  fourier_w_max: 15.0
  rho: 7.0
  sigma_data: 0.5
  sigma_off: 0.3
  sigma_min_ode: 2.0e-3
  sigma_max_ode: 5.0
  denoising_steps: 3

reward_end:
  inp_proj_ch: 32
  channels: [32, 32, 32, 32]
  final_res_attn_ch: 32
  downsample_after: [false, true, false, true]
  lstm_dim: 64
  group_size: 32
  num_heads: 4
  cond_dim: 64

actor_critic:
  inp_proj_ch: 32
  channels: [32, 32]
  downsample_after: [true, true]
  lstm_dim: 64
  group_size: 32

world:
  ctx_frames: 4
  horizon: 5

train:
  sample_weights: [0.1, 0.1, 0.1, 0.7]
  epochs_after_collection: 2

  collection:
    eps: 0.01
    init_min_env_steps: 300
    init_max_env_steps: 400
    init_min_reward_steps: 1
    env_steps_per_epoch: 100
    total_env_steps: 600

  denoiser:
    steps_init: 4
    steps_per_epoch: 3
    batch_size: 4
    lr: 1.0e-4
    weight_decay: 1.0e-2
    warmup_steps: 10
    max_grad_norm: 1.0
    future_frames: 2
    p_mean: -0.4
    p_std: 1.2
    sigma_min: 2.0e-3
    sigma_max: 20.0

  reward_end:
    steps_init: 4
    steps_per_epoch: 3
    batch_size: 4
    lr: 1.0e-4
    weight_decay: 1.0e-2
    warmup_steps: 10
    max_grad_norm: 100.0

  actor_critic:
    steps_init: 4
    steps_per_epoch: 3
    batch_size: 4
    lr: 1.0e-4
    weight_decay: 0.0
    warmup_steps: 10
    max_grad_norm: 100.0

  rl:
    gamma: 0.985
    lamb: 0.95
    weight_value: 1.0
    weight_entropy: 0.001

  eval:
    every: 2
    num_games: 2
    num_games_final: 3
    max_steps_per_game: 2000
    eps: 0.0

telemetry:
  project: neverwake
  mode: online
  flush_every: 2
  video_every: 2
  video_max_frames: 50
  video_clips: 3
  video_scale: 2
  save_every: 2
  stats_interval_sec: 2.0
